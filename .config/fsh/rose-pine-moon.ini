; Rosé Pine Moon for fast-syntax-highlighting.
; Цвета только именами или номером из палитры 256. Запись fg=#hex парсер не понимает.
; Подключается из ~/.config/zsh/.zshrc: fast-theme ~/.config/fsh/rose-pine-moon.ini

[base]
default          = none
unknown-token    = 168,bold
commandseparator = 103
redirection      = 103
here-string-tri  = 222
here-string-text = none
here-string-var  = 152
exec-descriptor  = 222,bold
comment          = 60
correct-subtle   = 152
incorrect-subtle = 168
subtle-separator = 73
subtle-bg        = bg:236
secondary        = zdharma
recursive-base   = 183

[command-point]
reserved-word     = 183
subcommand        = 183
alias             = 152
suffix-alias      = 152
global-alias      = 152
builtin           = 73
function          = 73
command           = 152
precommand        = 183
hashed-command    = 152
single-sq-bracket = 152
double-sq-bracket = 152
double-paren      = 222

[paths]
path          = 222
pathseparator = 103
path-to-dir   = 222,underline
globbing      = 174,bold
globbing-ext  = 174

[brackets]
paired-bracket   = bg:237
bracket-level-1  = 152,bold
bracket-level-2  = 222,bold
bracket-level-3  = 183,bold

[arguments]
single-hyphen-option   = 152
double-hyphen-option   = 152
back-quoted-argument   = none
single-quoted-argument = 222
double-quoted-argument = 222
dollar-quoted-argument = 222
optarg-string          = 222
optarg-number          = 222

[in-string]
back-dollar-quoted-argument           = 152
back-or-dollar-double-quoted-argument = 152

[other]
variable             = 183
assign               = none
assign-array-bracket = 152
history-expansion    = 174,bold

[math]
mathvar = 73,bold
mathnum = 222
matherr = 168

[for-loop]
forvar  = none
fornum  = 222
foroper = 183
forsep  = 183,bold

[case]
case-input       = 183
case-parentheses = 183
case-condition   = 152
