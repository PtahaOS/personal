; Rosé Pine Moon for fast-syntax-highlighting.
; Подключается из ~/.config/zsh/.zshrc: fast-theme ~/.config/fsh/rose-pine-moon.ini

[base]
default          = fg=#e0def4
unknown-token    = fg=#eb6f92,bold
commandseparator = fg=#908caa
redirection      = fg=#908caa
here-string-tri  = fg=#f6c177
here-string-text = fg=#e0def4
here-string-var  = fg=#9ccfd8
exec-descriptor  = fg=#f6c177,bold
comment          = fg=#6e6a86
correct-subtle   = fg=#9ccfd8
incorrect-subtle = fg=#eb6f92
subtle-separator = fg=#3e8fb0
subtle-bg        = bg=#2a273f
secondary        = default

[command-point]
reserved-word  = fg=#c4a7e7
subcommand     = fg=#c4a7e7
alias          = fg=#9ccfd8
suffix-alias   = fg=#9ccfd8
global-alias   = fg=#9ccfd8
builtin        = fg=#3e8fb0
function       = fg=#3e8fb0
command        = fg=#9ccfd8
precommand     = fg=#c4a7e7
hashed-command = fg=#9ccfd8
single-sq-bracket = fg=#9ccfd8
double-sq-bracket = fg=#9ccfd8
double-paren   = fg=#f6c177

[paths]
path          = fg=#f6c177
pathseparator = fg=#908caa
path-to-dir   = fg=#f6c177,underline
globbing      = fg=#ea9a97,bold
globbing-ext  = fg=#ea9a97

[brackets]
paired-bracket = bg=#393552
bracket-level-1 = fg=#9ccfd8,bold
bracket-level-2 = fg=#f6c177,bold
bracket-level-3 = fg=#c4a7e7,bold

[arguments]
single-hyphen-option   = fg=#9ccfd8
double-hyphen-option   = fg=#9ccfd8
back-quoted-argument   = fg=#e0def4
single-quoted-argument = fg=#f6c177
double-quoted-argument = fg=#f6c177
dollar-quoted-argument = fg=#f6c177

[in-string]
back-dollar-quoted-argument           = fg=#9ccfd8
back-or-dollar-double-quoted-argument = fg=#9ccfd8

[other]
variable             = fg=#c4a7e7
assign               = fg=#e0def4
assign-array-bracket = fg=#9ccfd8
history-expansion    = fg=#ea9a97,bold

[math]
mathvar = fg=#3e8fb0,bold
mathnum = fg=#f6c177
matherr = fg=#eb6f92

[for-loop]
forvar = fg=#e0def4
fornum = fg=#f6c177
foroper = fg=#c4a7e7
forsep = fg=#c4a7e7,bold
