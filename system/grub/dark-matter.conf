# Dark Matter GRUB (VandalByte/darkmatter-grub2-theme).
# Стиль Arch, ассеты 1080p, цветные иконки. Панель FA608UP: 1920x1200.
# setup.sh вписывает только эти ключи в /etc/default/grub.
# GRUB_CMDLINE_LINUX (LUKS) скрипт не трогает.
GRUB_THEME="/boot/grub/themes/darkmatter/theme.txt"
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3
GRUB_GFXMODE=1920x1200,auto
GRUB_GFXPAYLOAD_LINUX=keep
